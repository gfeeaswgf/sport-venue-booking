<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2348e5"><meta name="description" content="校园体育场馆预约平台，在线选择场地与时段，管理预约与入场凭证。"><title>场馆预约 · 跃动校园</title><link rel="stylesheet" href="/css/element.css"><link rel="stylesheet" href="/css/sport.css?v=20261116-async1"></head>
<body data-page="venue"><div id="app" v-cloak><sport-header :profile="profile" :active="active"></sport-header><main class="page-shell" v-loading="loading"><div v-if="error" class="error-banner" role="alert"><i class="el-icon-warning-outline"></i><span>{{error}}</span><button onclick="location.reload()">重新加载</button></div>
<a class="back-link" href="/index.html"><i class="el-icon-arrow-left"></i> 返回预约大厅</a>
<template v-if="venue"><section class="venue-hero" :class="selectedKind.color"><div><span class="eyebrow">{{selectedKind.name}} / CAMPUS VENUE</span><h1>{{venue.name}}</h1><p><i class="el-icon-location-outline"></i> {{venue.address}}</p><div class="venue-hero-tags"><span><i class="el-icon-time"></i> {{venue.openHours}}</span><span>免费预约</span></div></div><span class="venue-hero-emoji" aria-hidden="true">{{selectedKind.icon}}</span></section>
<div class="booking-layout"><section class="panel booking-panel"><div class="section-heading"><div><span class="eyebrow muted">BOOK A SESSION</span><h2>选择你的场次</h2></div><span class="subtle">以实际发布时段为准</span></div><div class="date-strip"><button v-for="d in days" :key="d.value" :class="{selected:selectedDate===d.value}" @click="chooseDate(d.value)"><span>{{d.label}}</span><b>{{d.short}}</b></button></div><h3 class="field-title">选择场地</h3><div class="court-tabs"><button v-for="c in courts" :key="c.id" :class="{selected:selectedCourt && selectedCourt.id===c.id}" @click="selectCourt(c)">{{c.name}}</button></div><div v-if="selectedCourt" class="slot-heading"><h3 class="field-title">选择时段</h3><span class="subtle">{{selectedCourt.mode==='COURT' ? '包场 · 含本人最多'+selectedCourt.maxPeople+'人' : '个人名额 · 每单1人'}}</span></div><div class="slot-grid" v-loading="busy"><button class="slot-button" v-for="s in slots" :key="s.id" :disabled="!s.available || busy" @click="openBooking(s)"><b>{{u.time(s.startTime)}}–{{u.time(s.endTime)}}</b><span>{{s.available ? (selectedCourt.mode==='SESSION' ? '剩余 '+s.remaining+' 个名额' : '可预约 · 免费') : s.statusText}}</span><i v-if="s.available" class="el-icon-plus"></i></button></div><div v-if="!slots.length && !busy" class="empty-state compact"><i class="el-icon-date"></i><h3>当前日期暂未发布场次</h3><p>请更换日期，或稍后再来查看。</p></div></section>
<aside><section class="panel venue-notice"><span class="eyebrow muted">BEFORE YOU BOOK</span><h2>预约须知</h2><p class="description">{{venue.description}}</p><div class="notice-text">{{venue.notice}}</div><div class="rule-item"><i class="el-icon-circle-check"></i><span>每天限预约一次，取消后可重新预约</span></div><div class="rule-item"><i class="el-icon-time"></i><span>{{venue.cancelAdvanceMinutes ? '取消需提前至少 '+venue.cancelAdvanceMinutes+' 分钟' : '开场前可取消预约'}}</span></div><div class="rule-item"><i class="el-icon-tickets"></i><span>入场请出示“我的预约”中的核销码</span></div></section><div class="soft-note"><i class="el-icon-info"></i>预约人资料将自动同步当前登录账号。同行人仅随本单入场。</div></aside></div>
<el-dialog title="确认预约" :visible.sync="bookingVisible" :close-on-click-modal="false" custom-class="booking-dialog"><template v-if="selectedSlot && selectedCourt"><div class="confirmation-summary"><span class="eyebrow muted">YOUR NEXT SESSION</span><h3>{{venue.name}} · {{selectedCourt.name}}</h3><p>{{selectedDate}} &nbsp; {{u.time(selectedSlot.startTime)}}–{{u.time(selectedSlot.endTime)}}</p><span class="free-label">免费预约</span></div><h3 class="field-title">预约人 <span class="small-tag">自动同步当前账号</span></h3><div v-if="ready" class="profile-summary"><span><small>姓名</small>{{profile.realName}}</span><span><small>学号 / 工号</small>{{profile.studentNo}}</span><span><small>手机号</small>{{profile.phone}}</span></div><div v-else class="profile-missing"><p>请先完善姓名、学号，保存后将返回当前场馆。</p><a :href="profileReturn" class="button primary">完善本人资料 <i class="el-icon-arrow-right"></i></a></div><template v-if="selectedCourt.mode==='COURT'"><div class="slot-heading"><h3 class="field-title">同行人 <span class="subtle">可选，最多{{selectedCourt.maxPeople-1}}人</span></h3><el-button type="text" @click="addCompanion" :disabled="companions.length>=selectedCourt.maxPeople-1">+ 添加同行人</el-button></div><div v-for="(person,i) in companions" :key="i" class="companion-row"><el-input v-model.trim="person.name" maxlength="32" placeholder="同行人姓名" :aria-label="'同行人'+(i+1)+'姓名'"></el-input><el-input v-model.trim="person.studentNo" maxlength="32" placeholder="学号 / 工号" :aria-label="'同行人'+(i+1)+'学号'"></el-input><el-button icon="el-icon-close" circle @click="companions.splice(i,1)" aria-label="移除同行人"></el-button></div></template><div class="agreement"><el-checkbox v-model="agreement">我已阅读预约须知，确认按时入场</el-checkbox></div><button class="button primary full" :disabled="busy || !ready || !agreement" @click="submitBooking">{{busy ? '正在提交…' : '确认预约'}} <i class="el-icon-arrow-right"></i></button></template></el-dialog>
</template>
</main><footer class="site-footer"><a class="footer-brand" href="/index.html">跃动校园 <span>CAMPUS SPORTS</span></a><span>体育场馆预约与管理平台 · 让运动成为校园日常</span></footer><sport-nav :active="active"></sport-nav></div><noscript>请开启 JavaScript 后使用场馆预约平台。</noscript><script src="/js/vue.js"></script><script src="/js/axios.min.js"></script><script src="/js/element.js"></script><script src="/js/sport-utils.js"></script><script src="/js/booking-request.js?v=20261116-async1"></script><script src="/js/common.js"></script><script src="/js/footer.js?v=20261114-nav1"></script><script src="/js/sport.js?v=20261116-async1"></script></body></html>
