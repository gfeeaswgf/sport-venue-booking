<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2348e5"><meta name="description" content="校园体育场馆预约平台，在线选择场地与时段，管理预约与入场凭证。"><title>个人中心 · 跃动校园</title><link rel="stylesheet" href="/css/element.css"><link rel="stylesheet" href="/css/sport.css?v=20261116-async1"></head>
<body data-page="profile"><div id="app" v-cloak><sport-header :profile="profile" :active="active"></sport-header><main class="page-shell" v-loading="loading"><div v-if="error" class="error-banner" role="alert"><i class="el-icon-warning-outline"></i><span>{{error}}</span><button onclick="location.reload()">重新加载</button></div>
<div class="page-title"><span class="eyebrow muted">YOUR SPORTS SPACE</span><h1>我的运动空间</h1><p>管理个人资料，让下一次预约更轻松。</p></div><template v-if="profile"><div class="profile-layout"><section class="panel profile-card"><span class="large-avatar"><i class="el-icon-user"></i></span><h2>{{profile.realName || profile.nickName}}</h2><span class="small-tag">{{profile.isAdmin ? '场馆管理员' : '校园运动伙伴'}}</span><div class="profile-fields"><div><span>手机号</span><b>{{profile.phone}}</b></div><div><span>学号 / 工号</span><b>{{profile.studentNo || '待完善'}}</b></div><div><span>预约资料</span><b :class="{warning:!ready}">{{ready ? '已完善 · 预约自动同步' : '请先完善姓名和学号'}}</b></div></div><a href="/info-edit.html" class="button outline full">编辑预约资料 <i class="el-icon-edit"></i></a></section><section class="profile-actions"><a class="panel action-card" href="/reservations.html"><span class="action-icon"><i class="el-icon-tickets"></i></span><div><h3>我的预约</h3><p>查看预约记录、取消预约和入场凭证</p></div><i class="el-icon-arrow-right"></i></a><a v-if="profile.isAdmin" class="panel action-card" href="/admin.html"><span class="action-icon peach"><i class="el-icon-setting"></i></span><div><h3>场馆管理</h3><p>维护场馆、发布时段、核销预约</p></div><i class="el-icon-arrow-right"></i></a><div class="panel tips-card"><h3>每一次相约，都请认真对待</h3><p>每天限预约一次。请按场馆要求提前取消，准时出示入场凭证，给更多伙伴留下运动的机会。</p></div><button class="logout-button" @click="logout">退出当前账号 <i class="el-icon-switch-button"></i></button></section></div></template>
