<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2348e5"><meta name="description" content="校园体育场馆预约平台，在线选择场地与时段，管理预约与入场凭证。"><title>场馆管理 · 跃动校园</title><link rel="stylesheet" href="/css/element.css"><link rel="stylesheet" href="/css/sport.css?v=20261116-async1"></head>
<body data-page="admin"><div id="app" v-cloak><sport-header :profile="profile" :active="active"></sport-header><main class="page-shell" v-loading="loading"><div v-if="error" class="error-banner" role="alert"><i class="el-icon-warning-outline"></i><span>{{error}}</span><button onclick="location.reload()">重新加载</button></div>
<div class="page-title"><span class="eyebrow muted">VENUE OPERATIONS</span><h1>场馆管理工作台</h1><p>维护开放资源，管理场次，核验每一次入场。</p></div><template v-if="isAdmin"><el-tabs v-model="adminTab" @tab-click="adminChanged"><el-tab-pane label="场馆与场地" name="venues"></el-tab-pane><el-tab-pane label="时段发布" name="slots"></el-tab-pane><el-tab-pane label="预约与核销" name="orders"></el-tab-pane></el-tabs><template v-if="adminTab==='venues'"><div class="section-heading"><h2>场馆</h2><button class="button primary" @click="editVenue(null)">+ 新增场馆</button></div><div class="admin-venue-grid"><article class="panel admin-venue" v-for="v in venues" :key="v.id"><div><span class="small-tag">{{u.category(v.category).name}}</span><span class="status-pill" :class="v.enabled?'RESERVED':'CANCELLED'">{{v.enabled?'开放':'停用'}}</span></div><h3>{{v.name}}</h3><p>{{v.address}}</p><p>{{v.openHours}}</p><button class="text-button" @click="editVenue(v)">编辑场馆 <i class="el-icon-edit"></i></button></article></div><div class="section-heading"><h2>场地</h2><div class="inline-controls"><el-select v-model="adminVenueId" @change="adminVenueChanged" placeholder="选择场馆"><el-option v-for="v in venues" :key="v.id" :value="v.id" :label="v.name"></el-option></el-select><button class="button primary" :disabled="!adminVenueId" @click="editCourt(null)">+ 新增场地</button></div></div><div class="panel table-scroll"><table><thead><tr><th>场地名称</th><th>预约方式</th><th>容量 / 人数</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="c in courts" :key="c.id"><td>{{c.name}}</td><td>{{c.mode==='COURT'?'包场':'个人名额'}}</td><td>{{c.capacity}}单 / 每单最多{{c.maxPeople}}人</td><td>{{c.enabled?'开放':'停用'}}</td><td><button class="text-button" @click="editCourt(c)">编辑</button></td></tr></tbody></table><p v-if="!courts.length" class="field-hint">暂无场地，请先新增。</p></div></template>
<template v-if="adminTab==='slots'"><section class="panel"><h2>发布开放时段</h2><p class="field-hint">时段容量取场地设置；重复、重叠或已开始的时段不能发布。已有预约的时段不能关闭。</p><div class="admin-controls"><label>场馆<el-select v-model="adminVenueId" @change="adminVenueChanged"><el-option v-for="v in venues" :key="v.id" :label="v.name" :value="v.id"></el-option></el-select></label><label>场地<el-select v-model="adminCourtId" @change="adminSlotsChanged"><el-option v-for="c in courts" :key="c.id" :label="c.name" :value="c.id"></el-option></el-select></label><label>日期<el-select v-model="selectedDate" @change="adminSlotsChanged"><el-option v-for="d in days" :key="d.value" :label="d.value+' '+d.label" :value="d.value"></el-option></el-select></label></div><form class="publish-form" @submit.prevent="publishSlot"><label>开始时间<input type="time" v-model="slotForm.startTime" required></label><label>结束时间<input type="time" v-model="slotForm.endTime" required></label><button class="button primary" :disabled="busy || !adminCourtId">发布时段 <i class="el-icon-plus"></i></button></form></section><div class="panel table-scroll"><table><thead><tr><th>时段</th><th>已约 / 容量</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="s in slots" :key="s.id"><td>{{u.time(s.startTime)}}–{{u.time(s.endTime)}}</td><td>{{s.bookedCount}} / {{s.capacity}}</td><td>{{s.statusText}}</td><td><button class="text-button" :disabled="s.bookedCount>0" @click="toggleSlot(s)">{{s.enabled?'关闭时段':'开放时段'}}</button></td></tr></tbody></table><p v-if="!slots.length" class="field-hint">当前日期暂无时段。</p></div></template>
<template v-if="adminTab==='orders'"><div class="section-heading"><h2>预约记录</h2><el-select v-model="orderStatus" @change="adminFilterOrders"><el-option label="全部状态" value=""></el-option><el-option label="待使用" value="RESERVED"></el-option><el-option label="已完成" value="COMPLETED"></el-option><el-option label="已取消" value="CANCELLED"></el-option><el-option label="已过期" value="EXPIRED"></el-option></el-select></div><div class="panel table-scroll"><table><thead><tr><th>预约人</th><th>场馆 / 场地</th><th>日期 / 时段</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="o in orders" :key="o.id"><td>{{o.realName}}<small>{{o.studentNo}} · {{o.peopleCount}}人</small></td><td>{{o.venueName}}<small>{{o.courtName}}</small></td><td>{{o.bookingDate}}<small>{{u.time(o.startTime)}}–{{u.time(o.endTime)}}</small></td><td><span class="status-pill" :class="o.status">{{o.statusText}}</span></td><td><button class="button outline" :disabled="!o.canVerify || busy" @click="verifyOrder(o)">核销入场</button></td></tr></tbody></table><p v-if="!orders.length" class="field-hint">暂无预约记录。</p></div><el-pagination v-if="total>10" background layout="prev,pager,next" :current-page.sync="current" :page-size="10" :total="total" @current-change="loadAdminOrders"></el-pagination></template>
<el-dialog title="场馆资料" :visible.sync="venueDialog"><el-form label-position="top"><el-form-item label="场馆名称"><el-input v-model.trim="venueForm.name" maxlength="64"></el-input></el-form-item><el-form-item label="运动分类"><el-select v-model="venueForm.category"><el-option v-for="(c,code) in categories" :key="code" :label="c.name" :value="code"></el-option></el-select></el-form-item><el-form-item label="地址"><el-input v-model.trim="venueForm.address" maxlength="255"></el-input></el-form-item><el-form-item label="展示开放时间（实际可约时间由发布场次决定）"><el-input v-model="venueForm.openHours" maxlength="64"></el-input></el-form-item><el-form-item label="介绍"><el-input type="textarea" v-model="venueForm.description" maxlength="2000"></el-input></el-form-item><el-form-item label="预约须知"><el-input type="textarea" v-model="venueForm.notice" maxlength="4000" :rows="3"></el-input></el-form-item><el-form-item label="取消需提前的分钟数（0表示开场前）"><el-input-number v-model="venueForm.cancelAdvanceMinutes" :min="0" :max="1440"></el-input-number></el-form-item><el-form-item label="开放状态"><el-switch v-model="venueForm.enabled"></el-switch></el-form-item><button class="button primary full" :disabled="busy" @click="saveAdminVenue">保存场馆</button></el-form></el-dialog>
<el-dialog title="场地资料" :visible.sync="courtDialog"><el-form label-position="top"><el-form-item label="场地名称"><el-input v-model.trim="courtForm.name" maxlength="64"></el-input></el-form-item><el-form-item label="预约方式"><el-select v-model="courtForm.mode"><el-option label="包场（每时段1单）" value="COURT"></el-option><el-option label="个人名额（每单1人）" value="SESSION"></el-option></el-select></el-form-item><el-form-item label="每时段容量（单）"><el-input-number v-model="courtForm.capacity" :min="1" :max="1000"></el-input-number></el-form-item><el-form-item label="每单含本人最多人数"><el-input-number v-model="courtForm.maxPeople" :min="1" :max="6"></el-input-number></el-form-item><el-form-item label="开放状态"><el-switch v-model="courtForm.enabled"></el-switch></el-form-item><p class="field-hint">包场容量应为1；个人名额每单人数应为1。容量调整仅影响新发布时段。</p><button class="button primary full" :disabled="busy" @click="saveAdminCourt">保存场地</button></el-form></el-dialog></template>
</main><footer class="site-footer"><a class="footer-brand" href="/index.html">跃动校园 <span>CAMPUS SPORTS</span></a><span>体育场馆预约与管理平台 · 让运动成为校园日常</span></footer><sport-nav :active="active"></sport-nav></div><noscript>请开启 JavaScript 后使用场馆预约平台。</noscript><script src="/js/vue.js"></script><script src="/js/axios.min.js"></script><script src="/js/element.js"></script><script src="/js/sport-utils.js"></script><script src="/js/booking-request.js?v=20261116-async1"></script><script src="/js/common.js"></script><script src="/js/footer.js?v=20261114-nav1"></script><script src="/js/sport.js?v=20261116-async1"></script></body></html>
