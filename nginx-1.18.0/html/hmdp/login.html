<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2348e5"><meta name="description" content="校园体育场馆预约平台，在线选择场地与时段，管理预约与入场凭证。"><title>登录 · 跃动校园</title><link rel="stylesheet" href="/css/element.css"><link rel="stylesheet" href="/css/sport.css?v=20261116-async1"></head>
<body data-page="login"><div id="app" v-cloak><sport-header :profile="profile" :active="active"></sport-header><main class="page-shell" v-loading="loading"><div v-if="error" class="error-banner" role="alert"><i class="el-icon-warning-outline"></i><span>{{error}}</span><button onclick="location.reload()">重新加载</button></div>
<div class="login-layout"><section class="login-story"><span class="eyebrow">YOUR COURT IS CALLING</span><h1>每一次运动，<br>都值得期待。</h1><p>登录，找到校园里的下一份热爱。</p><div class="court-illustration small-court" aria-hidden="true"><div class="court-mid"></div><div class="court-net"></div><div class="court-ball"></div></div><span class="story-footer">跃动校园 / 体育场馆预约与管理平台</span></section><section class="login-form"><span class="eyebrow muted">WELCOME BACK</span><h1>欢迎回来</h1><p class="subtle">手机号验证码登录，首次登录自动创建账号</p><form @submit.prevent="login"><label>手机号</label><el-input v-model.trim="loginForm.phone" maxlength="11" inputmode="tel" placeholder="请输入11位手机号" aria-label="手机号"></el-input><label>验证码</label><div class="code-row"><el-input v-model.trim="loginForm.code" maxlength="6" inputmode="numeric" placeholder="6位验证码" aria-label="验证码"></el-input><button type="button" @click="sendCode" :disabled="busy || countdown>0">{{countdown ? countdown+' 秒后重发' : '获取验证码'}}</button></div><div class="login-explainer"><i class="el-icon-info"></i><span>当前使用原项目验证码方式，验证码在后端运行控制台查看。</span></div><div class="agreement"><el-checkbox v-model="loginAgreed">我知悉需如实填写资料、遵守场馆预约规则</el-checkbox></div><button class="button primary full" :disabled="busy">{{busy ? '请稍候…' : '登录并继续'}} <i class="el-icon-arrow-right"></i></button></form><a class="back-link" href="/index.html">先逛逛场馆 <i class="el-icon-right"></i></a></section></div>
</main><footer class="site-footer"><a class="footer-brand" href="/index.html">跃动校园 <span>CAMPUS SPORTS</span></a><span>体育场馆预约与管理平台 · 让运动成为校园日常</span></footer><sport-nav :active="active"></sport-nav></div><noscript>请开启 JavaScript 后使用场馆预约平台。</noscript><script src="/js/vue.js"></script><script src="/js/axios.min.js"></script><script src="/js/element.js"></script><script src="/js/sport-utils.js"></script><script src="/js/booking-request.js?v=20261116-async1"></script><script src="/js/common.js"></script><script src="/js/footer.js?v=20261114-nav1"></script><script src="/js/sport.js?v=20261116-async1"></script></body></html>
