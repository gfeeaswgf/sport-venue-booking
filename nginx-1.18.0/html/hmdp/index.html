<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2348e5"><meta name="description" content="校园体育场馆预约平台，在线选择场地与时段，管理预约与入场凭证。"><title>预约大厅 · 跃动校园</title><link rel="stylesheet" href="/css/element.css"><link rel="stylesheet" href="/css/sport.css?v=20261116-async1"></head>
<body data-page="home"><div id="app" v-cloak><sport-header :profile="profile" :active="active"></sport-header><main class="page-shell" v-loading="loading"><div v-if="error" class="error-banner" role="alert"><i class="el-icon-warning-outline"></i><span>{{error}}</span><button onclick="location.reload()">重新加载</button></div>
<section class="hero"><div class="hero-copy"><span class="eyebrow"><span class="tiny-dot"></span> CAMPUS SPORTS · 校园体育</span><h1>把时间，<br>留给热爱的运动<span>。</span></h1><p>从一块场地开始，让每一次相约都轻松一点。<br>查找校园场馆，选择你的下一场运动。</p><a href="/shop-list.html" class="hero-button">即刻预约 <i class="el-icon-top-right"></i></a></div><div class="hero-visual" aria-hidden="true"><span class="visual-label">MAKE YOUR<br>NEXT MOVE.</span><div class="court-illustration"><div class="court-mid"></div><div class="court-net"></div><div class="court-ball"></div></div><div class="visual-badge"><i class="el-icon-time"></i> 你的主场，随时出发</div><span class="visual-number">SPORTS / 01</span></div></section>

<section id="venue-list"><div class="section-heading"><div><span class="eyebrow muted">FIND YOUR COURT</span><h2>今天，去哪里运动？</h2></div><form class="search-box" @submit.prevent="loadVenues"><i class="el-icon-search"></i><input v-model.trim="keyword" aria-label="搜索场馆" placeholder="搜索场馆名称"><button aria-label="搜索">搜索</button></form></div><div class="filter-row"><button :class="{selected:category===''}" @click="chooseCategory('')">全部场馆</button><button v-for="(c,code) in categories" :key="code" :class="{selected:category===code}" @click="chooseCategory(code)"><span>{{c.icon}}</span>{{c.name}}</button><span class="result-count">{{venues.length}} 个可预约场馆</span></div><div class="venue-grid"><venue-card v-for="v in venues" :key="v.id" :venue="v"></venue-card></div><div v-if="!loading && !error && !venues.length" class="empty-state"><i class="el-icon-search"></i><h3>没有找到相关场馆</h3><p>试试其他名称或运动分类。</p></div></section>

</main><footer class="site-footer"><a class="footer-brand" href="/index.html">跃动校园 <span>CAMPUS SPORTS</span></a><span>体育场馆预约与管理平台 · 让运动成为校园日常</span></footer><sport-nav :active="active"></sport-nav></div><noscript>请开启 JavaScript 后使用场馆预约平台。</noscript><script src="/js/vue.js"></script><script src="/js/axios.min.js"></script><script src="/js/element.js"></script><script src="/js/sport-utils.js"></script><script src="/js/booking-request.js?v=20261116-async1"></script><script src="/js/common.js"></script><script src="/js/footer.js?v=20261114-nav1"></script><script src="/js/sport.js?v=20261116-async1"></script></body></html>
